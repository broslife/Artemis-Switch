name: Feature and Integration CI

on:
  # Topic branches run through pull_request. Keeping agent/** and feature/**
  # here as well meant two runs per update on any branch with an open PR.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: artemis-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-integration:
    name: Consolidated portable integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate localization JSON syntax
        run: |
          python -m json.tool resources/i18n/en-US/main.json > /dev/null
          python -m json.tool resources/i18n/fr/main.json > /dev/null

      - name: Validate Artemis English/French translation coverage
        run: python tests/i18n_consistency_test.py

      - name: Validate release/CD contract
        run: python tests/release_contract_test.py

      - name: Validate isolated VPN build contract
        run: python tests/vpn_build_contract_test.py

      - name: Configure unit suite
        run: cmake -S tests -B build/tests -DCMAKE_BUILD_TYPE=Debug

      - name: Build unit suite
        run: cmake --build build/tests --parallel

      - name: Run unit suite
        run: ctest --test-dir build/tests --output-on-failure

      - name: Configure cross-feature integration suite
        run: cmake -S ci/integration -B build/integration -DCMAKE_BUILD_TYPE=Debug

      - name: Build cross-feature integration suite
        run: cmake --build build/integration --parallel

      - name: Run cross-feature integration suite
        run: ctest --test-dir build/integration --output-on-failure

  sanitizer-integration:
    name: ASan + UBSan integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      LDFLAGS: -fsanitize=address,undefined
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S tests -B build/tests-sanitized -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/tests-sanitized --parallel

      - name: Test
        run: ctest --test-dir build/tests-sanitized --output-on-failure

  ci-summary:
    name: Artemis CI summary
    if: always()
    needs:
      - portable-integration
      - sanitizer-integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require all integration jobs
        run: |
          test "${{ needs.portable-integration.result }}" = "success"
          test "${{ needs.sanitizer-integration.result }}" = "success"
