name: UI Preview (Windows)

# Builds the Windows app only, to check screens on a PC with made-up hosts
# (ARTEMIS_UI_PREVIEW=1, no network). It is not a release build.
on:
  workflow_dispatch:

jobs:
  build:
    name: Windows UCRT64 UI preview
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up MSYS2 UCRT64
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        release: false
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-pkgconf
          mingw-w64-ucrt-x86_64-SDL2
          mingw-w64-ucrt-x86_64-ffmpeg
          mingw-w64-ucrt-x86_64-curl
          mingw-w64-ucrt-x86_64-mbedtls
          mingw-w64-ucrt-x86_64-jansson
          mingw-w64-ucrt-x86_64-libpng
          mingw-w64-ucrt-x86_64-opus
          mingw-w64-ucrt-x86_64-expat
          mingw-w64-ucrt-x86_64-zstd
          mingw-w64-ucrt-x86_64-ntldd-git

    - name: Configure
      shell: pwsh
      run: '& "C:\msys64\ucrt64\bin\cmake.exe" --preset windows-ucrt64-release'

    - name: Build
      shell: pwsh
      run: '& "C:\msys64\ucrt64\bin\cmake.exe" --build --preset windows-ucrt64-release --parallel'

    - name: Collect runtime DLLs
      shell: msys2 {0}
      run: |
        exe="$(cygpath -u "$GITHUB_WORKSPACE")/build/windows-ucrt64/Moonlight.exe"
        outdir="$(dirname "$exe")"
        ntldd -R "$exe" | awk -v prefix="/ucrt64/bin/" '$2 == "=>" && index($3, prefix) == 1 { print $3 }' | sort -u | while read -r dll; do
          cp -f "$dll" "$outdir/"
        done

    - name: Add launcher
      shell: pwsh
      run: |
        $bat = "@echo off`r`nset ARTEMIS_UI_PREVIEW=1`r`nstart `"`" `"%~dp0Moonlight.exe`"`r`n"
        Set-Content -Path build/windows-ucrt64/Artemis-UI-Preview.bat -Value $bat -Encoding ascii -NoNewline

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Artemis-UI-Preview-windows
        retention-days: 14
        path: |
          build/windows-ucrt64/Moonlight.exe
          build/windows-ucrt64/*.dll
          build/windows-ucrt64/resources/**
          build/windows-ucrt64/Artemis-UI-Preview.bat
