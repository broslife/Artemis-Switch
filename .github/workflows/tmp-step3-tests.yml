name: tmp step3 tests
on:
  push:
    branches: [step3-cadence]
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run new portable tests
        run: |
          set -e
          for t in slot_intervals_test cadence_clock_test; do
            g++ -std=c++20 -Wall -Wextra -fsanitize=address,undefined -Iapp/src/streaming tests/$t.cpp -o $t
            ./$t
            echo "$t OK"
          done
