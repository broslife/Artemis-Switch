name: Docs

on:
  # Manual only: docs/requirements.txt no longer exists, so a push-triggered
  # build failed on every docs change. Restore the file before turning the
  # push trigger back on.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt

      - name: Build HTML
        run: sphinx-build -b html docs/source docs/_build/html

      - name: Add .nojekyll
        run: touch docs/_build/html/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs/_build/html
          branch: gh-pages
          single-commit: true
