name: All Builds

on:
  # This workflow fans out to cross-platform builds, so every trigger is
  # expensive. It runs by hand (workflow_dispatch) or for release tags; pull
  # requests are covered by the lighter lint and test workflows.
  #
  # Release tags do build the whole matrix. release.yml covers the shipping
  # Switch NRO only, so this is where the other platforms get verified before
  # a version goes out. PS Vita and macOS are not built by this fork.
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  workflow_call:

# Supersede in-flight runs for the same PR instead of letting a burst of
# updates queue a full matrix each. Tag builds are never cancelled: a release
# must finish.
concurrency:
  group: artemis-all-builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  switch:
    name: Nintendo Switch
    uses: ./.github/workflows/docker-image.yml

  windows:
    name: Windows
    uses: ./.github/workflows/windows.yml

  linux:
    name: Linux
    uses: ./.github/workflows/linux.yml
